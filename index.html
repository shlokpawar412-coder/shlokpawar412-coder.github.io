<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Futuristic Sci-Fi Fortune Teller</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
  margin:0; padding:0;
  font-family: 'Orbitron', Arial, sans-serif;
  background:black; color:#0ff; overflow:hidden; height:100vh;
  cursor: url('https://i.ibb.co/qJ3t1Bx/cursor.png'), auto;
}

/* Neon buttons */
button {
  padding: 14px 28px;
  margin:10px;
  font-size:18px;
  cursor:pointer;
  background:rgba(0,0,0,0.6);
  color:#0ff;
  border:2px solid #0ff;
  border-radius:12px;
  box-shadow: 0 0 15px #0ff;
  transition:0.3s;
}
button:hover {
  background:#0ff;
  color:black;
  box-shadow:0 0 30px #0ff, 0 0 50px #0ff;
}

/* Container */
.container { position:relative; z-index:10; padding-top:40px; }

/* Panels */
.panel {
  background: rgba(0,255,255,0.05);
  border:2px solid #0ff;
  border-radius:15px;
  box-shadow: 0 0 40px #0ff, inset 0 0 20px #0ff;
  padding:20px;
  margin:10px auto;
  width:90%;
  max-width:600px;
  backdrop-filter: blur(6px);
}

/* Hidden by default */
#scanText, #scanAnimation, #futureText, #videoSection { display:none; margin-top:20px; }

/* Palm Scan */
#scanAnimation { width:220px; height:320px; margin:20px auto; position:relative; overflow:hidden; }
#palmGlow { width:100%; height:100%; background: radial-gradient(circle, rgba(0,255,255,0.4), transparent); position:absolute; top:0; left:0; animation: glow 1s infinite alternate; }
#scanLine { position:absolute; top:-10%; left:0; width:100%; height:6px; background:lime; filter:blur(6px); animation: scan 2s linear infinite; }
@keyframes scan { 0%{top:-10%;} 100%{top:100%;} }
@keyframes glow { 0%{opacity:0.3;} 100%{opacity:0.7;} }

/* Future text */
#futureText {
  font-family: 'Courier New', monospace;
  font-size:22px; color:#0ff; text-shadow: 0 0 15px #0ff;
  min-height:60px; white-space: pre-wrap; letter-spacing: 2px;
}

/* Video */
#videoSection video {
  width: 100%;       /* full width of container */
  max-width: 560px;  /* max width for desktop */
  height: auto;      /* maintain aspect ratio */
  border: 3px solid #0ff;
  border-radius: 12px;
  box-shadow: 0 0 20px #0ff;
}


/* Background layers */
#nebula {
  position:fixed; top:0; left:0; width:100%; height:100%;
  background:url('https://upload.wikimedia.org/wikipedia/commons/1/1f/Eagle_nebula_pillars.jpg') center/cover no-repeat;
  opacity:0.25; filter:blur(2px);
  animation: nebulaPulse 15s ease-in-out infinite alternate;
  z-index:-4;
}
@keyframes nebulaPulse { from{opacity:0.25; filter:blur(2px) brightness(1);} to{opacity:0.45; filter:blur(3px) brightness(1.5);} }

#stars, #stars2 {
  position:fixed; top:0; left:0; width:100%; height:100%; z-index:-3;
}
#stars { background:url('https://upload.wikimedia.org/wikipedia/commons/0/08/White_stars.png') repeat; animation: starMove 60s linear infinite; }
#stars2 { background:url('https://upload.wikimedia.org/wikipedia/commons/1/1c/Star_field_background.png') repeat; animation: starMove 120s linear infinite; }
@keyframes starMove { from{background-position:0 0;} to{background-position:-10000px 5000px;} }

/* Shooting stars */
.shooting-star { position:absolute; width:2px; height:80px; background: linear-gradient(white, rgba(255,255,255,0)); transform: rotate(45deg); animation: shoot 1.5s linear infinite; }
@keyframes shoot { 0% { transform: translate(0,0) rotate(45deg); opacity:1; } 100% { transform: translate(800px,400px) rotate(45deg); opacity:0; } }

/* Neon grid */
#grid { position:fixed; bottom:0; left:0; width:100%; height:35vh; background: linear-gradient(#0ff3, #0ff1), url('https://upload.wikimedia.org/wikipedia/commons/3/3f/Neon_grid_floor.png'); background-size:cover; opacity:0.35; animation: gridMove 6s linear infinite; z-index:-2; }
@keyframes gridMove { from { transform: perspective(500px) rotateX(65deg) translateY(0); } to { transform: perspective(500px) rotateX(65deg) translateY(50px); } }

/* Planets */
.planet { position:fixed; width:120px; height:120px; background-size:cover; animation: planetSpin linear infinite; }
#planet1 { top:8%; left:5%; background-image:url('https://upload.wikimedia.org/wikipedia/commons/c/c7/Earth_Eastern_Hemisphere.jpg'); animation-duration:35s; }
#planet2 { top:60%; right:8%; background-image:url('https://upload.wikimedia.org/wikipedia/commons/0/02/OSIRIS_Mars_true_color.jpg'); animation-duration:45s; }
@keyframes planetSpin { from{transform:rotate(0deg);} to{transform:rotate(360deg);} }

/* UFO */
#ufo { position:fixed; top:30%; width:150px; height:auto; left:-20%; animation: ufoFly 12s linear infinite; filter: drop-shadow(0 0 25px lime); }
@keyframes ufoFly { 0%{ left:-25%; top:25%; } 50%{ left:50%; top:15%; } 100%{ left:120%; top:35%; } }

/* Responsive */
@media(max-width:600px){
  #scanAnimation{width:150px;height:250px;}
  #videoSection iframe{width:90%;height:auto;}
  .planet{width:80px;height:80px;}
  #ufo{width:100px;}
}
</style>
</head>

<body>

<!-- Background -->
<div id="nebula"></div>
<div id="stars"></div>
<div id="stars2"></div>
<div id="grid"></div>
<div id="planet1" class="planet"></div>
<div id="planet2" class="planet"></div>
<img id="ufo" src="https://upload.wikimedia.org/wikipedia/commons/3/3d/Flying_saucer.png" alt="UFO">

<!-- Background Music -->
<audio id="bgMusic" autoplay loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<div class="container">

  <!-- Step 1 -->
  <div class="panel">
    <h1 id="mainText">DO YOU WANT TO SEE YOUR FUTURE?</h1>
    <div id="buttons">
      <button onclick="seeFuture()">YES</button>
      <button onclick="badLuck()">NO</button>
    </div>
  </div>

  <!-- Step 2 -->
  <div class="panel">
    <h2 id="scanText">SCAN YOUR PALM HERE</h2>
    <div id="scanAnimation">
      <div id="palmGlow"></div>
      <div id="scanLine"></div>
    </div>
  </div>

  <!-- Step 3 -->
  <div class="panel">
    <h2 id="futureText"></h2>
  </div>

  <!-- Step 4 -->
  <div class="panel" id="videoSection">
   <video id="2026" width="560" height="315" controls autoplay loop muted>
  <source src="2026.mp4" type="video/mp4">
  Your browser does not support the video tag.
</video>

  </div>
</div>

<script>
function seeFuture() {
  document.getElementById("mainText").style.display = "none";
  document.getElementById("buttons").style.display = "none";

  document.getElementById("scanText").style.display = "block";
  document.getElementById("scanAnimation").style.display = "block";

  const scanSound = new Audio('https://www.soundjay.com/laser/sounds/laser-zap-01.mp3');
  scanSound.play();

  setTimeout(() => {
    document.getElementById("scanText").style.display = "none";
    document.getElementById("scanAnimation").style.display = "none";

    const futureText = "CALCULATING...\nYOUR FUTURE IS LOADING...\nALL SYSTEMS ONLINE...\nA GREAT ADVENTURE AWAITS YOU!";
    typeText(futureText, 0);
    document.getElementById("videoSection").style.display = "block";

    const iframe = document.getElementById("youtubeVideo");
    iframe.src = iframe.src;
  }, 4000);
}

function badLuck() {
  document.getElementById("mainText").innerText = "WISH YOU A VERY VERY BAD LUCK";
  document.getElementById("buttons").style.display = "none";
  document.getElementById("scanText").style.display = "none";
  document.getElementById("scanAnimation").style.display = "none";
  document.getElementById("futureText").style.display = "none";
  document.getElementById("videoSection").style.display = "none";
}

function typeText(text, i) {
  if(i < text.length){
    document.getElementById("futureText").style.display = "block";
    document.getElementById("futureText").innerText += text.charAt(i);
    setTimeout(()=>typeText(text,i+1),50);
  }
}

function createShootingStar() {
  const star = document.createElement('div');
  star.className = 'shooting-star';
  star.style.top = Math.random()*window.innerHeight+'px';
  star.style.left = Math.random()*window.innerWidth+'px';
  star.style.animationDuration = 1 + Math.random()*1.5 + 's';
  document.body.appendChild(star);
  setTimeout(()=>{ star.remove(); }, 1500);
}
setInterval(createShootingStar, 1000);
</script>

</body>
</html>
